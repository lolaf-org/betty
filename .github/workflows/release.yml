name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release, without a leading v (e.g. 0.1.0). Ignored when performOnly.'
        required: false
        type: string
      developmentVersion:
        description: 'Version to leave main on afterwards (e.g. 0.2.0-SNAPSHOT). Ignored when performOnly.'
        required: false
        type: string
      dryRun:
        description: 'Rehearse: build and verify only - no commit, no tag, no push, no upload'
        required: false
        default: false
        type: boolean
      # Recovery, not routine. If prepare pushed and perform then failed, the tag is real and only the
      # deployment is missing
      performOnly:
        description: 'Skip prepare and deploy an existing tag (set tag below)'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Tag to deploy when performOnly (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything else - checkout with the release token, the changelog gate, signing, prepare, perform and the
  # GitHub Release - is in the shared workflow. It needs CI_GITHUB_TOKEN, the three GPG_* secrets and the two
  # CENTRAL_TOKEN_* secrets, all org secrets shared with this repository.
  release:
    uses: lolaf-org/workflows/.github/workflows/maven-release.yml@v1.0.0
    with:
      release-version: ${{ inputs.releaseVersion }}
      development-version: ${{ inputs.developmentVersion }}
      dry-run: ${{ inputs.dryRun }}
      perform-only: ${{ inputs.performOnly }}
      tag: ${{ inputs.tag }}
      # One JDK: no betty module declares a toolchain, so there is nothing for a second JDK to serve.
      timeout-minutes: 45
    secrets: inherit
