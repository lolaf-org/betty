name: dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's own pull requests. It is not an immediate merge:
# main requires the build check, so the pull request sits until that passes and is dropped if it fails.
# Major updates never reach here - dependabot.yml ignores them - so what merges is patch and minor only.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      # Reads what the pull request actually updates, so a major arriving through a route dependabot.yml
      # does not cover is left for a human rather than merged by omission.
      - id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
