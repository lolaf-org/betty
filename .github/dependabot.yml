version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

    # Without grouping this is two dozen pinned versions arriving one pull request at a time
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.sonatype.central:*"
          - "com.mycila:license-maven-plugin"
          - "org.projectlombok:lombok-maven-plugin"
      test-libraries:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.awaitility:*"
      # Only the benchmarks module compiles against these, and nothing published depends on them:
      # they are the stacks betty is measured against, so they move together or not at all.
      benchmark-libraries:
        patterns:
          - "org.openjdk.jmh:*"
          - "io.aeron:*"
          - "io.netty:*"
          - "org.eclipse.jetty:*"
          - "org.apache.mina:*"
          - "net.openhft:*"

    # slf4j is held at 2.0.x deliberately.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.slf4j:*"
